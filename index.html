<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#101522">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="app-version" content="1.0.0">
<title>App</title>
<link rel="manifest" href="./manifest.webmanifest">
<link rel="icon" href="./icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="./icon.svg">
<style>
:root{color-scheme:dark;font:16px -apple-system,BlinkMacSystemFont,sans-serif;background:#101522;color:#f3f6fc}
*{box-sizing:border-box}body{margin:0;min-height:100dvh;padding:calc(env(safe-area-inset-top) + 28px) 24px calc(env(safe-area-inset-bottom) + 24px);display:grid;place-items:center}
main{width:min(100%,420px)}.logo{width:68px;height:68px;border-radius:20px;background:#506cf4;display:grid;place-items:center;font-size:32px;font-weight:750}h1{font-size:42px;letter-spacing:-1.8px;margin:20px 0 6px}p{color:#aeb9d0;line-height:1.5}.card{margin:24px 0;padding:20px;background:#1b2335;border:1px solid #303c54;border-radius:22px}.row{display:flex;justify-content:space-between;align-items:center;gap:12px;font-size:14px}.dot{display:inline-block;width:9px;height:9px;border-radius:50%;background:#67d9a6;margin-right:7px}button{display:block;width:100%;border:0;border-radius:14px;padding:15px;font:inherit;font-weight:650;background:#506cf4;color:white;cursor:pointer;margin-top:18px}button:disabled{opacity:.6}a{color:#aebdff}small{color:#aeb9d0}
</style>
</head>
<body>
<main>
<div class="logo" aria-hidden="true">A</div>
<h1>App</h1><p>Your GitHub-powered iPhone app.</p>
<section class="card" aria-label="Update status">
<div class="row"><span><span class="dot" id="dot"></span><span id="status" role="status" aria-live="polite">Checking for updates…</span></span><small id="version"></small></div>
<button id="check" type="button">Check for updates</button>
</section>
<p id="install" hidden>Install from Safari: Share → Add to Home Screen → Open as Web App.</p>
<small>Updates are delivered from <a href="https://github.com/helpmeid/app" target="_blank" rel="noopener">GitHub</a>.</small>
</main>
<script>
const version=document.querySelector('meta[name="app-version"]').content;
const statusEl=document.getElementById('status'),button=document.getElementById('check'),dot=document.getElementById('dot');
document.getElementById('version').textContent='v'+version;
document.getElementById('install').hidden=matchMedia('(display-mode: standalone)').matches||navigator.standalone===true;
let checking=false;
function status(message,ok){statusEl.textContent=message;dot.style.background=ok?'#67d9a6':'#f0b95b'}
async function check(){
 if(checking||document.hidden)return;
 checking=true;button.disabled=true;status('Checking for updates…',true);
 try{
  const url=new URL('./index.html',location.href);url.searchParams.set('update',Date.now());
  const res=await fetch(url,{cache:'no-store'});
  if(!res.ok)throw new Error('Update unavailable');
  const doc=new DOMParser().parseFromString(await res.text(),'text/html');
  const latest=doc.querySelector('meta[name="app-version"]')?.content;
  if(!latest)throw new Error('Invalid update');
  if(latest!==version){
   status('Installing update…',true);
   location.replace(url.href);
   return;
  }
  status('Up to date',true);
 }catch(e){status(navigator.onLine?'Update check unavailable':'Offline · saved version',false)}
 finally{checking=false;button.disabled=false}
}
if('serviceWorker' in navigator){navigator.serviceWorker.register('./sw.js',{updateViaCache:'none'}).catch(()=>{});}
button.addEventListener('click',check);
document.addEventListener('visibilitychange',()=>{if(!document.hidden)check()});
window.addEventListener('online',check);
window.addEventListener('offline',()=>status('Offline · saved version',false));
setInterval(check,60000);
check();
</script>
</body>
</html>

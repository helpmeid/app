name: Build iPhone app
on:
  workflow_dispatch:
  push:
    paths:
      - 'ios/**'
      - '.github/workflows/ios-build.yml'
permissions:
  contents: read
jobs:
  build:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - name: Generate Xcode project and icons
        working-directory: ios
        run: |
          brew install xcodegen
          python3 generate_icons.py
          xcodegen generate
      - name: Compile unsigned iOS app
        working-directory: ios
        run: |
          xcodebuild -project MessengerApp.xcodeproj -scheme MessengerApp -configuration Release -sdk iphoneos -derivedDataPath build CODE_SIGNING_ALLOWED=NO build
      - name: Package unsigned app
        working-directory: ios
        run: |
          mkdir -p Payload
          cp -R build/Build/Products/Release-iphoneos/MessengerApp.app Payload/
          ditto -c -k --keepParent Payload unsigned-MessengerApp.ipa
      - uses: actions/upload-artifact@v4
        with:
          name: unsigned-iPhone-app-not-installable-until-signed
          path: ios/unsigned-MessengerApp.ipa
